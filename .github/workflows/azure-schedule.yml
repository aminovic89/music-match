name: Azure Schedule — Stop/Start PROD

# Stratégie "off par défaut" : PROD reste éteint sauf déclenchement manuel
# (quand on travaille dessus ou pour tester). Plus de démarrage automatique
# le matin — seul un arrêt de sécurité tourne chaque soir, au cas où un
# démarrage manuel aurait été oublié.
#
# Pour démarrer : Actions > Azure Schedule — Stop/Start PROD > Run workflow
# > action = start (ou `gh workflow run azure-schedule.yml -f action=start`).

on:
  schedule:
    # Horaire UTC pour viser ~20:00 Europe/Paris en heure d'hiver (les cron
    # GitHub Actions ne s'ajustent pas à l'heure d'été — décalage d'~1h en été).
    - cron: '0 19 * * *'  # arrêt de sécurité ~20:00 Paris, tous les jours
  workflow_dispatch:
    inputs:
      action:
        description: 'Action à déclencher manuellement'
        required: true
        type: choice
        options: [start, stop]

env:
  AZURE_WEBAPP_NAME_PROD: music-match-api-prod
  AZURE_RESOURCE_GROUP_PROD: music-match-prod-rg
  AZURE_DB_NAME_PROD: music-match-db-prod-v2

jobs:
  start-prod:
    name: Start PROD
    if: inputs.action == 'start'
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure (PROD)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Start App Service + Postgres PROD
        run: |
          az webapp start --name ${{ env.AZURE_WEBAPP_NAME_PROD }} --resource-group ${{ env.AZURE_RESOURCE_GROUP_PROD }}
          state=$(az postgres flexible-server show --name ${{ env.AZURE_DB_NAME_PROD }} --resource-group ${{ env.AZURE_RESOURCE_GROUP_PROD }} --query state -o tsv)
          if [ "$state" != "Ready" ]; then
            az postgres flexible-server start --name ${{ env.AZURE_DB_NAME_PROD }} --resource-group ${{ env.AZURE_RESOURCE_GROUP_PROD }}
          else
            echo "Postgres PROD déjà démarré (state=$state), rien à faire."
          fi

  stop-prod:
    name: Stop PROD
    if: (github.event.schedule == '0 19 * * *') || (inputs.action == 'stop')
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure (PROD)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Stop App Service + Postgres PROD
        run: |
          az webapp stop --name ${{ env.AZURE_WEBAPP_NAME_PROD }} --resource-group ${{ env.AZURE_RESOURCE_GROUP_PROD }}
          state=$(az postgres flexible-server show --name ${{ env.AZURE_DB_NAME_PROD }} --resource-group ${{ env.AZURE_RESOURCE_GROUP_PROD }} --query state -o tsv)
          if [ "$state" != "Stopped" ]; then
            az postgres flexible-server stop --name ${{ env.AZURE_DB_NAME_PROD }} --resource-group ${{ env.AZURE_RESOURCE_GROUP_PROD }}
          else
            echo "Postgres PROD déjà arrêté (state=$state), rien à faire."
          fi
